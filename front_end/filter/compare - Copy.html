<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Compare Courses</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #0d1321;
      --ink-2: #1f2937;
      --muted: #6b7280;
      --border: #e5e7eb;
      --accent: #0f766e;
      --accent-2: #f59e0b;
      --bg: #f8fafc;
      --card: #ffffff;
      --shadow: 0 20px 60px rgba(13, 19, 33, 0.12);
      --radius: 16px;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color: var(--ink);
      background: radial-gradient(1200px 800px at 10% -10%, #d1fae5 0%, transparent 60%),
                  radial-gradient(900px 700px at 110% 10%, #fef3c7 0%, transparent 60%),
                  var(--bg);
    }

    .page {
      max-width: 1200px;
      margin: 32px auto 64px;
      padding: 0 20px;
    }

    .header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 20px;
      border-radius: 20px;
      background: #0f172a;
      color: #f8fafc;
      box-shadow: var(--shadow);
    }

    .header h1 {
      margin: 0;
      font-family: Fraunces, serif;
      font-size: clamp(24px, 2.4vw, 36px);
    }

    .header a {
      color: #f8fafc;
      text-decoration: none;
      border: 1px solid rgba(248, 250, 252, 0.3);
      padding: 8px 12px;
      border-radius: 10px;
      font-weight: 600;
    }

    .panel {
      margin-top: 20px;
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1px solid rgba(15, 118, 110, 0.08);
      padding: 16px;
    }

    .status {
      font-size: 13px;
      color: var(--muted);
    }

    .compare-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    .compare-table th,
    .compare-table td {
      border: 1px solid var(--border);
      padding: 10px 12px;
      font-size: 13px;
      vertical-align: top;
    }

    .compare-table th {
      background: #f8fafc;
      text-align: left;
      width: 180px;
      color: var(--ink-2);
      font-weight: 600;
    }

    .course-title {
      font-weight: 600;
      color: var(--ink);
    }

    .badge {
      display: inline-block;
      background: #ecfeff;
      color: #155e75;
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      margin-top: 6px;
    }

    @media (max-width: 820px) {
      .compare-table,
      .compare-table thead,
      .compare-table tbody,
      .compare-table th,
      .compare-table td,
      .compare-table tr {
        display: block;
        width: 100%;
      }

      .compare-table tr {
        margin-bottom: 16px;
      }

      .compare-table th {
        width: 100%;
        border-bottom: none;
        background: #f1f5f9;
      }

      .compare-table td {
        border-top: none;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="header">
      <h1>Compare Courses</h1>
      <a href="index.html">Back to results</a>
    </div>

    <section class="panel">
      <div class="status" id="compare-status">Loading courses...</div>
      <div id="compare-table-wrapper"></div>
    </section>
  </main>

  <script src="compare.js"></script>
</body>
</html>
